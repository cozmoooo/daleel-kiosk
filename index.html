<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daleel Hajj Kiosk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Kufi+Arabic:wght@400;600;700&family=Alexandria:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: presentation page — copy and journey steps on the left, a life-size-proportioned
   kiosk totem on the right running the real interface; kiosk mode (#kiosk) shows only the screen. */
:root{
  color-scheme: dark;
  /* showcase */
  --bg:#0C0B10; --panel:#15131B; --line:rgba(237,233,242,.10); --fg:#EDE9F2; --muted:#A39DAE;
  --gold:#D9B46A; --violet:#9B6BFF; --cyan:#3EE6FF;
  --display:'Reem Kufi','Readex Pro',system-ui,sans-serif;
  --ui:'Readex Pro','Noto Naskh Arabic','Noto Sans Bengali','Noto Sans SC','Noto Sans',system-ui,sans-serif;
  /* kiosk screen */
  --k-ink:#071A17; --k-emerald:#0E3B33; --k-jade:#1E7A66; --k-gold:#D9B46A; --k-gold-2:#E8C987;
  --k-sand:#F3E9D2; --k-ihram:#FBF8F1; --k-red:#E5484D; --k-sky:#5CC8FF; --k-text:#0B231F;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--ui);margin:0;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.minw0{min-width:0}

/* ═══════════ SHOWCASE PAGE ═══════════ */
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:22px}
.mark{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:22px;letter-spacing:.02em}
.mark small{font-family:var(--ui);font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:2px}
.proto{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(217,180,106,.35);padding:7px 14px;border-radius:999px;white-space:nowrap}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:56px;align-items:start;padding-block:8px 56px}
.copy{max-width:560px}
.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1.title{font-family:var(--display);font-weight:600;font-size:clamp(40px,5.2vw,70px);line-height:1.04;margin:14px 0 18px;text-wrap:balance}
h1.title em{font-style:normal;color:var(--gold)}
.lead{font-size:18px;line-height:1.65;color:var(--muted);max-width:52ch;margin:0}
.steps-h{margin:34px 0 10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.steps button{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:14px;padding:11px 4px;border-bottom:1px solid var(--line);text-align:start;color:var(--muted);transition:color .2s}
.steps button:hover{color:var(--fg)}
.steps .n{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.steps .lbl{font-size:16px}
.steps .sub{font-size:13px;opacity:.7}
.steps button.on{color:var(--fg)}
.steps button.on .n{background:var(--gold);border-color:var(--gold);color:#1A1408;font-weight:700}
.langs-h{margin:26px 0 10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.langs{display:flex;flex-wrap:wrap;gap:8px}
.langs button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--muted)}
.langs button.on{border-color:var(--gold);color:var(--gold)}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:26px}
.btn-demo{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:14px;background:var(--gold);color:#1A1408;font-size:16px;font-weight:600}
.btn-demo:hover{filter:brightness(1.07)}
.cta-row > span{font-size:14px;color:var(--muted)}
.tip{margin-top:20px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.showcase{overflow-x:clip}
.kcol{display:flex;justify-content:center;min-width:0;position:sticky;top:8px;align-self:start}
.fit{position:relative}
.feat{padding-block:28px 64px;border-top:1px solid var(--line)}
.feat h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,3vw,40px);margin:28px 0 8px;text-wrap:balance}
.feat > p{color:var(--muted);margin:0 0 30px;max-width:60ch;line-height:1.6}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 40px}
.fi{min-width:0}
.fi svg{color:var(--gold)}
.fi h3{font-size:18px;font-weight:600;margin:12px 0 6px}
.fi p{color:var(--muted);line-height:1.6;margin:0;font-size:15px}
.specs{margin-top:44px;display:flex;flex-wrap:wrap;gap:10px 28px;color:var(--muted);font-size:14px;padding-top:22px;border-top:1px solid var(--line)}
.specs span{display:flex;align-items:center;gap:8px}
.specs span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.foot{padding-block:22px 40px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;border-top:1px solid var(--line)}
.foot code{color:var(--fg);background:var(--panel);padding:2px 6px;border-radius:6px}
@media (max-width:980px){
  .hero{grid-template-columns:minmax(0,1fr);gap:36px}
  .kcol{order:-1;position:static}
  .copy{max-width:none}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){ .fgrid{grid-template-columns:minmax(0,1fr)} .proto{display:none} .steps .sub{display:none} .steps button{grid-template-columns:30px minmax(0,1fr)} }

/* ═══════════ TOTEM (built to match the kiosk photo) ═══════════ */
.totem{position:absolute;left:0;top:0;width:660px;height:1380px;transform-origin:0 0}
.t-aura{position:absolute;inset:-60px -160px 40px -120px;pointer-events:none;
  background:
   radial-gradient(40% 30% at 82% 26%, rgba(155,107,255,.30), transparent 70%),
   radial-gradient(38% 30% at 84% 72%, rgba(62,230,255,.22), transparent 70%),
   radial-gradient(50% 40% at 40% 55%, rgba(217,180,106,.08), transparent 70%)}
.t-floor{position:absolute;left:-40px;right:-40px;top:1290px;height:120px;border-radius:50%;
  background:radial-gradient(50% 50% at 50% 40%, rgba(0,0,0,.75), transparent 70%)}
.t-side{position:absolute;left:600px;top:26px;width:44px;height:1226px;border-radius:0 34px 10px 0;
  background:linear-gradient(90deg,#101114,#1d1e23 55%,#121316);box-shadow:inset -2px 0 0 rgba(255,255,255,.04)}
.led{position:absolute;left:20px;width:5px;border-radius:4px}
.led.p{top:150px;height:430px;background:#C08BFF;box-shadow:0 0 10px 2px rgba(176,120,255,.9),0 0 46px 10px rgba(155,107,255,.45)}
.led.c{top:660px;height:520px;background:#7CF1FF;box-shadow:0 0 10px 2px rgba(62,230,255,.9),0 0 46px 10px rgba(62,230,255,.4)}
.t-body{position:absolute;left:0;top:0;width:608px;height:1262px;border-radius:44px 44px 16px 16px;
  background:linear-gradient(90deg,#1a1b1f 0%,#2c2d32 14%,#25262b 55%,#1c1d21 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.09),inset 2px 0 0 rgba(255,255,255,.05),0 50px 90px -30px rgba(0,0,0,.9)}
.t-cam{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:84px;height:16px;border-radius:10px;background:#09090b;box-shadow:inset 0 1px 2px rgba(0,0,0,.8)}
.t-cam::after{content:"";position:absolute;left:36px;top:3px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#3a4a6a,#0b0d14 60%)}
.t-bezel{position:absolute;top:58px;left:26px;width:556px;height:976px;border-radius:14px;background:#040405;padding:8px;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.t-glare{position:absolute;inset:8px;border-radius:6px;pointer-events:none;z-index:50;background:linear-gradient(118deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 30%)}
.t-slot{position:absolute;top:1072px;left:114px;width:380px;height:44px;border-radius:10px;background:#060607;box-shadow:inset 0 3px 8px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.06)}
.t-slot::after{content:"";position:absolute;left:12%;right:12%;top:20px;height:3px;border-radius:2px;background:#7CF1FF;box-shadow:0 0 12px 2px rgba(62,230,255,.7);animation:slotglow 2.4s ease-in-out infinite}
.t-slot-l{position:absolute;top:1124px;left:0;width:608px;text-align:center;font-size:12px;letter-spacing:.34em;color:#6D6E78}
.t-word{position:absolute;top:1150px;left:0;width:608px;display:flex;justify-content:center;align-items:center;gap:14px;
  font-family:var(--display);font-size:58px;color:#7CF1FF;text-shadow:0 0 18px rgba(62,230,255,.75),0 0 2px #fff}
.t-word img{max-height:70px}
.t-plinth{position:absolute;left:-26px;top:1252px;width:700px;height:72px;border-radius:12px 12px 8px 8px;
  background:linear-gradient(180deg,#2d2e33,#16171a 70%);box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 30px 50px rgba(0,0,0,.7)}
@keyframes slotglow{50%{opacity:.45}}

/* ═══════════ KIOSK SCREEN (540×960 design px) ═══════════ */
#app{width:540px;height:960px;position:relative;overflow:hidden;border-radius:6px;background:var(--k-ink);color:var(--k-ihram);
  font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{--tf:'Readex Pro';--ui:var(--tf),'Noto Naskh Arabic','Noto Sans Bengali','Noto Sans SC','Noto Sans',system-ui,sans-serif}
#app[data-lang="ur"],#app[data-lang="fa"]{--ui:'Noto Naskh Arabic',var(--tf),'Noto Sans',system-ui,sans-serif}
.k-view{position:absolute;inset:0}
#app button{font-family:inherit}
body.present{overflow:hidden;height:100%;background:radial-gradient(80% 80% at 50% 40%,#10302A,#04100E 70%)}
body.kiosk{background:#000}
body.present .showcase{display:none}
body.present #app{position:fixed;left:50%;top:50%;transform-origin:center;border-radius:0;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.pv-bar{position:fixed;z-index:200;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));display:none;gap:8px;transition:opacity .4s}
body.present:not(.kiosk) .pv-bar{display:flex}
.pv-bar.idle{opacity:0}
.pv-bar button{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:rgba(12,11,16,.8);border:1px solid rgba(237,233,242,.18);color:var(--fg);font-size:14px;backdrop-filter:blur(8px)}

.k-screen{position:absolute;inset:0;display:flex;flex-direction:column}
.k-dark{background:radial-gradient(120% 65% at 50% 0%,#14503F 0%,#0A2924 46%,#071A17 100%);color:var(--k-ihram)}
.k-light{background:var(--k-ihram);color:var(--k-text)}
.k-pat{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;-webkit-mask-image:linear-gradient(#000,transparent 75%);mask-image:linear-gradient(#000,transparent 75%)}
[dir="rtl"] .flip{transform:scaleX(-1)}
#app.entering .k-in{animation:kin .45s cubic-bezier(.2,.8,.2,1) both}
#app.entering .k-in:nth-child(2){animation-delay:.04s}
#app.entering .k-in:nth-child(3){animation-delay:.08s}
#app.entering .k-in:nth-child(4){animation-delay:.12s}
#app.entering .k-in:nth-child(5){animation-delay:.16s}
#app.entering .k-in:nth-child(6){animation-delay:.2s}
@keyframes kin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* status bar */
.k-sb{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:relative;z-index:6;
  background:rgba(4,17,15,.82);color:rgba(251,248,241,.88);font-size:14px;border-bottom:1px solid rgba(217,180,106,.18)}
.k-sb .l,.k-sb .r{display:flex;align-items:center;gap:7px;white-space:nowrap}
.k-sb .c{position:absolute;left:50%;transform:translateX(-50%);color:var(--k-gold);font-size:13px;font-weight:500;white-space:nowrap}
.k-sb .sep{width:1px;height:14px;background:rgba(251,248,241,.25);margin:0 4px}
.k-sb .t{font-variant-numeric:tabular-nums}

.k-pad{flex:1;display:flex;flex-direction:column;gap:16px;padding:22px 28px 26px;position:relative;min-height:0}
.k-head{display:flex;align-items:center;gap:14px}
.k-head h1{margin:0;font-size:26px;font-weight:700}
.k-back{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:#fff;border:1px solid rgba(7,26,23,.12);color:var(--k-text);flex-shrink:0}
.k-back.dark{background:rgba(251,248,241,.08);border-color:rgba(251,248,241,.16);color:var(--k-ihram)}
.k-sec-h{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600;color:var(--k-text)}
.k-sec-h.small{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
[lang="ur"].k-sec-h.small,[lang="fa"] .k-sec-h.small{letter-spacing:0}

/* ATTRACT */
.k-att{flex:1;display:flex;flex-direction:column;align-items:center;padding:22px 30px 0;gap:14px;position:relative;text-align:center}
.k-brand{display:flex;align-items:center;gap:14px}
.k-brand svg{color:var(--k-gold)}
.k-word{font-family:'Reem Kufi',var(--ui);font-size:42px;line-height:1;color:var(--k-gold-2)}
.k-word-l{font-size:11px;letter-spacing:.38em;opacity:.6;margin-top:6px}
.k-rot{min-height:132px;display:flex;flex-direction:column;align-items:center;gap:8px}
.k-rot h1{margin:0;font-size:29px;font-weight:600;line-height:1.3;text-wrap:balance}
.k-rot p{margin:0;font-size:16px;line-height:1.55;opacity:.68;max-width:400px}
.k-fade{animation:kfade .5s ease-out both}
@keyframes kfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.k-portal{position:relative;width:296px;height:296px;flex-shrink:0;border-radius:50%}
.k-rings{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.k-rings polygon,.k-rings circle{fill:none;transform-box:fill-box;transform-origin:center}
.k-rings .r1{stroke:rgba(217,180,106,.55);stroke-width:1.4;animation:spin 40s linear infinite}
.k-rings .r2{stroke:rgba(217,180,106,.28);stroke-width:1;animation:spin 28s linear infinite reverse}
.k-rings .r3{stroke:rgba(232,201,135,.85);stroke-width:2;stroke-dasharray:60 593;stroke-linecap:round;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.k-win{position:absolute;left:50%;top:50%;width:184px;height:184px;transform:translate(-50%,-50%);border-radius:26px;
  background:linear-gradient(160deg,rgba(251,248,241,.10),rgba(251,248,241,.03));border:1px solid rgba(217,180,106,.35);
  box-shadow:0 0 40px rgba(217,180,106,.18),inset 0 0 30px rgba(217,180,106,.08);overflow:hidden}
.k-win .qrg{position:absolute;inset:38px;color:rgba(251,248,241,.16)}
.k-cn{position:absolute;width:34px;height:34px;border:3px solid var(--k-gold-2)}
.k-cn.a{top:12px;left:12px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.k-cn.b{top:12px;right:12px;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.k-cn.c{bottom:12px;left:12px;border-right:0;border-top:0;border-radius:0 0 0 12px}
.k-cn.d{bottom:12px;right:12px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.k-laser{position:absolute;left:10%;right:10%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--k-gold-2),transparent);box-shadow:0 0 14px var(--k-gold-2);animation:laser 2.4s ease-in-out infinite}
@keyframes laser{0%,100%{top:14%}50%{top:84%}}
.k-ok{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px}
.k-ok .ring{width:86px;height:86px;border-radius:50%;background:var(--k-gold);display:grid;place-items:center;color:var(--k-ink);animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.k-dots{display:flex;gap:9px;justify-content:center}
.k-dots i{width:9px;height:9px;border-radius:50%;background:currentColor;animation:bounce 1s ease-in-out infinite}
.k-dots i:nth-child(2){animation-delay:.15s}.k-dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:scale(.4);opacity:.3}40%{transform:none;opacity:1}}
.k-scantext{min-height:0;gap:6px}
.k-scantext h2{margin:0;font-size:26px;font-weight:700}
.k-scantext p{font-size:15px}
.k-demo{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--k-gold-2);background:rgba(217,180,106,.12);padding:5px 12px;border-radius:999px}
.k-below{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--k-gold-2);font-size:12.5px;letter-spacing:.08em;margin-top:auto;padding-bottom:4px}
.k-chev{animation:chev 1.6s ease-in-out infinite;opacity:.9}
.k-chev:nth-child(3){animation-delay:.2s;opacity:.5;margin-top:-14px}
@keyframes chev{50%{transform:translateY(5px)}}
.k-langs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px 26px 24px;position:relative}
.k-lp{padding:9px 16px;border-radius:999px;border:1px solid rgba(217,180,106,.3);font-size:15px;color:rgba(251,248,241,.8);transition:all .25s}
.k-lp.on{background:var(--k-gold);border-color:var(--k-gold);color:var(--k-ink);font-weight:600}

/* VERIFY */
.k-okb{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:rgba(30,122,102,.10);color:var(--k-jade);font-weight:600;font-size:16px}
.k-okb i{width:28px;height:28px;border-radius:50%;background:var(--k-jade);color:#fff;display:grid;place-items:center}
.k-id{position:relative;overflow:hidden;border-radius:26px;padding:22px 24px;color:var(--k-ihram);
  background:linear-gradient(135deg,#124A40 0%,#0A2924 58%,#0E3B33 100%);box-shadow:0 18px 40px -16px rgba(7,26,23,.55);display:flex;flex-direction:column;gap:18px}
.k-id::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--k-gold),var(--k-gold-2),var(--k-gold))}
.k-id-wm{position:absolute;width:250px;height:250px;inset-inline-end:-70px;top:-60px;color:rgba(217,180,106,.13)}
.k-id-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.2em;color:var(--k-gold-2)}
.k-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(217,180,106,.16);padding:4px 10px;border-radius:999px;letter-spacing:.05em}
.k-id-mid{display:flex;align-items:center;gap:18px;position:relative}
.k-photo{width:96px;height:96px;border-radius:50%;overflow:hidden;flex-shrink:0;border:3px solid var(--k-gold);box-shadow:0 0 0 5px rgba(217,180,106,.15)}
.k-photo img,.k-photo svg{width:100%;height:100%;object-fit:cover;display:block}
.k-id-name{font-size:28px;font-weight:700;line-height:1.15}
.k-id-num{font-size:14px;letter-spacing:.1em;opacity:.65;margin-top:6px;font-variant-numeric:tabular-nums;direction:ltr;text-align:start;unicode-bidi:plaintext}
.k-id-grid{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:12px;position:relative}
.k-id-grid small{display:block;font-size:11.5px;opacity:.6;margin-bottom:3px}
.k-id-grid b{font-size:15px;font-weight:600;line-height:1.3}
.k-lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k-lt{position:relative;height:82px;border-radius:18px;background:#fff;border:1.5px solid rgba(7,26,23,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--k-text);transition:all .2s}
.k-lt b{font-size:20px;font-weight:600}
.k-lt small{font-size:11px;letter-spacing:.14em;opacity:.45}
.k-lt.on{border:2px solid var(--k-gold);background:#FFF8E8}
.k-lt i{position:absolute;top:8px;inset-inline-end:8px;width:22px;height:22px;border-radius:50%;background:var(--k-gold);color:#fff;display:grid;place-items:center}
.k-cta{margin-top:auto;height:74px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:22px;font-weight:600;color:var(--k-ihram);
  background:linear-gradient(135deg,#0E3B33,#1E7A66);box-shadow:0 14px 30px -12px rgba(14,59,51,.7);transition:transform .15s}
.k-cta:active,.k-tile:active,.k-sosbar:active,.k-wf:active,.k-ct:active,.k-lt:active{transform:scale(.98)}

/* HUB */
.k-hub-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.k-hub-top small{font-size:16px;opacity:.6}
.k-hub-top h1{margin:2px 0 0;font-size:30px;font-weight:700;line-height:1.15}
.k-pill{display:flex;align-items:center;gap:7px;padding:10px 14px;border-radius:14px;border:1px solid rgba(7,26,23,.14);font-size:14px;color:var(--k-text);background:#fff;white-space:nowrap}
.k-track{background:#fff;border:1px solid rgba(7,26,23,.08);border-radius:22px;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.k-track-h small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.5}
.k-track-h b{font-size:17px;font-weight:600;color:var(--k-emerald)}
.k-days{display:flex;justify-content:space-between;position:relative}
.k-days::before{content:"";position:absolute;left:18px;right:18px;top:50%;height:2px;background:rgba(7,26,23,.1)}
.k-days span{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1.5px solid rgba(7,26,23,.15);font-size:15px;font-weight:600;color:rgba(11,35,31,.55);font-variant-numeric:tabular-nums}
.k-days span.on{background:var(--k-gold);border-color:var(--k-gold);color:var(--k-ink);box-shadow:0 0 0 6px rgba(217,180,106,.22)}
.k-info{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.k-prayer,.k-heat{border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.k-prayer{background:var(--k-emerald);color:var(--k-ihram)}
.k-prayer > svg,.k-heat > svg{position:absolute;top:14px;inset-inline-end:14px;opacity:.55}
.k-prayer small,.k-heat small{font-size:13px;opacity:.7}
.k-pr-row{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.k-pr-row b{font-size:24px;font-weight:600}
.k-pr-row span{font-size:22px;color:var(--k-gold-2);font-variant-numeric:tabular-nums}
.k-prayer em,.k-heat em{font-style:normal;font-size:13px;opacity:.75;margin-top:4px}
.k-heat{background:#F6E5C3;color:#6E4210}
.k-heat b{font-size:26px;font-weight:700;margin-top:2px}
.k-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0}
.k-tile{position:relative;border-radius:26px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;text-align:start;overflow:hidden;transition:transform .15s}
.k-tile b{display:block;font-size:21px;font-weight:600;line-height:1.25}
.k-tile span{display:block;font-size:14px;opacity:.75;line-height:1.45;margin-top:4px}
.k-tile-wf{background:linear-gradient(160deg,#1E7A66,#0E3B33);color:var(--k-ihram)}
.k-tile-ai{background:linear-gradient(160deg,#1B2422,#0A1513);color:var(--k-ihram)}
.k-tile .art{position:absolute;inset:0 0 auto 0;height:58%}
.k-tile-txt{position:relative}
.k-go{position:absolute;top:16px;inset-inline-end:16px;width:40px;height:40px;border-radius:50%;background:rgba(251,248,241,.14);display:grid;place-items:center}
.k-mini-orb{position:absolute;top:36px;left:50%;width:108px;height:108px;margin-left:-54px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFF1CF 0%,#E8C987 22%,#C9A04E 45%,#1E7A66 80%,#0E3B33 100%);
  box-shadow:0 0 40px rgba(217,180,106,.45);animation:breathe 4s ease-in-out infinite}
.k-mini-orb.big{position:relative;top:auto;left:auto;margin:0;width:140px;height:140px}
@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 60px rgba(217,180,106,.6)}}
.k-sosbar{height:94px;border-radius:24px;display:flex;align-items:center;gap:16px;padding:0 20px;text-align:start;color:#fff;
  background:linear-gradient(135deg,#E5484D,#B4232A);box-shadow:0 14px 30px -14px rgba(229,72,77,.8);transition:transform .15s;flex-shrink:0}
.k-sosbar b{display:block;font-size:20px;font-weight:600}
.k-sosbar span{display:block;font-size:14px;opacity:.85}
.k-sosbar > div{flex:1}
.k-sosbar .k-sosb{width:60px;height:60px;border-radius:50%;background:#fff;color:#C62A31;display:grid;place-items:center;font-weight:700;font-size:17px;letter-spacing:.04em;flex-shrink:0;box-shadow:0 0 0 6px rgba(255,255,255,.18)}

/* EMERGENCY */
.k-em{background:linear-gradient(180deg,#FFF1F1 0%,var(--k-ihram) 45%)}
.k-sos-wrap{position:relative;width:300px;height:300px;margin:4px auto 0;flex-shrink:0}
.k-sos-ring{position:absolute;inset:0;transform:rotate(-90deg)}
.k-sos-ring .bg{fill:none;stroke:rgba(229,72,77,.14);stroke-width:12}
.k-sos-ring .fg{fill:none;stroke:var(--k-red);stroke-width:12;stroke-linecap:round}
.k-sos{position:absolute;inset:30px;border-radius:50%;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:none;
  background:radial-gradient(circle at 35% 30%,#FF7A7E,#E5484D 45%,#A91E25);box-shadow:0 20px 40px -10px rgba(229,72,77,.65);animation:halo 2.4s ease-out infinite}
.k-sos b{font-size:58px;font-weight:700;letter-spacing:.06em;line-height:1}
.k-sos span{font-size:15px;opacity:.92;max-width:170px;text-align:center;line-height:1.35}
.k-sos.hold{animation:none;transform:scale(.96)}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(229,72,77,.45),0 20px 40px -10px rgba(229,72,77,.65)}100%{box-shadow:0 0 0 34px rgba(229,72,77,0),0 20px 40px -10px rgba(229,72,77,.65)}}
.k-contacts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.k-ct{min-height:104px;border-radius:20px;background:#fff;border:1px solid rgba(7,26,23,.09);padding:16px;display:flex;align-items:center;gap:12px;text-align:start;color:var(--k-text);transition:transform .15s}
.k-ct > i{width:46px;height:46px;border-radius:14px;background:rgba(30,122,102,.1);color:var(--k-jade);display:grid;place-items:center;flex-shrink:0}
.k-ct.red > i{background:rgba(229,72,77,.1);color:var(--k-red)}
.k-ct b{display:block;font-size:18px;font-weight:600;line-height:1.2}
.k-ct.red b{font-size:26px;font-variant-numeric:tabular-nums}
.k-ct span{display:block;font-size:13px;opacity:.6;margin-top:3px;line-height:1.35}
.k-scrim{position:absolute;inset:0;background:rgba(7,26,23,.45);z-index:20;animation:kfade .25s both}
.k-call{position:absolute;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:30px 30px 0 0;padding:30px 28px 34px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--k-text);animation:sheet .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.k-call-ic{width:84px;height:84px;border-radius:50%;background:var(--k-jade);color:#fff;display:grid;place-items:center;animation:halo2 1.6s ease-out infinite;margin-bottom:8px}
@keyframes halo2{0%{box-shadow:0 0 0 0 rgba(30,122,102,.4)}100%{box-shadow:0 0 0 26px rgba(30,122,102,0)}}
.k-call small{font-size:15px;opacity:.6}
.k-call b{font-size:26px;font-weight:700}
.k-call .num{font-size:17px;opacity:.7;font-variant-numeric:tabular-nums}
.k-call .k-dots{color:var(--k-jade);margin:8px 0 14px}
.k-endcall{width:100%;height:64px;border-radius:18px;background:var(--k-red);color:#fff;font-size:19px;font-weight:600}
.k-sos-on{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 36px;text-align:center;color:#fff;
  background:radial-gradient(90% 60% at 50% 30%,#D23A40 0%,#8E141A 70%,#5E0B10 100%);animation:kfade .3s both}
.k-pulse{position:relative;width:170px;height:170px;margin-bottom:14px}
.k-pulse i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:ripple 2.4s ease-out infinite}
.k-pulse i:nth-child(2){animation-delay:.8s}.k-pulse i:nth-child(3){animation-delay:1.6s}
@keyframes ripple{from{transform:scale(.5);opacity:1}to{transform:scale(1.35);opacity:0}}
.k-pulse-core{position:absolute;inset:38px;border-radius:50%;background:#fff;color:#B4232A;display:grid;place-items:center}
.k-sos-on h2{margin:0;font-size:34px;font-weight:700}
.k-sos-on p{margin:0;font-size:17px;opacity:.88;line-height:1.5;max-width:380px}
.k-loc{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);text-align:start;margin-top:10px}
.k-loc b{display:block;font-size:16px}
.k-loc span{display:block;font-size:13px;opacity:.75;font-variant-numeric:tabular-nums}
.k-eta{font-size:15px;opacity:.85}
.k-cancel{margin-top:18px;height:58px;padding:0 34px;border-radius:16px;border:1.5px solid rgba(255,255,255,.55);font-size:17px;font-weight:600}

/* WAYFINDING */
.k-q{margin:0;font-size:28px;font-weight:600;line-height:1.25}
.k-wfl{display:flex;flex-direction:column;gap:12px}
.k-wf{min-height:124px;border-radius:24px;background:#fff;border:1px solid rgba(7,26,23,.09);display:flex;align-items:center;gap:16px;padding:16px 18px;text-align:start;color:var(--k-text);transition:transform .15s}
.k-wf > div{flex:1}
.k-wf-ic{width:68px;height:68px;border-radius:20px;background:rgba(30,122,102,.1);color:var(--k-jade);display:grid;place-items:center;flex-shrink:0}
.k-wf b{display:block;font-size:20px;font-weight:600}
.k-wf span{display:block;font-size:14px;opacity:.6;margin-top:3px}
.k-wf em{display:flex;align-items:center;gap:6px;font-style:normal;font-size:14px;margin-top:8px;color:var(--k-jade);font-weight:500}
.k-wf.mine{background:linear-gradient(135deg,#0E3B33,#1E7A66);color:var(--k-ihram);border-color:transparent}
.k-wf.mine .k-wf-ic{background:rgba(217,180,106,.2);color:var(--k-gold-2)}
.k-wf.mine em{color:var(--k-gold-2)}
.k-wf.mine span{opacity:.8}
.k-crowd{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 10px;border-radius:999px;white-space:nowrap;font-weight:500}
.k-crowd::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.k-crowd.c0{background:rgba(30,160,110,.12);color:#13895E}
.k-crowd.c1{background:rgba(232,150,40,.14);color:#B26A0C}
.k-crowd.c2{background:rgba(229,72,77,.12);color:#C62A31}
.k-dark .k-crowd.c0{color:#5EE3A8;background:rgba(94,227,168,.12)}
.k-dark .k-crowd.c1{color:#F5B65A;background:rgba(245,182,90,.14)}
.k-dark .k-crowd.c2{color:#FF8186;background:rgba(255,129,134,.14)}
.k-wf.mine .k-crowd.c0{background:rgba(255,255,255,.14);color:#9FF0C8}

/* MAP */
.k-maphead{height:78px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 22px;position:relative;z-index:4;background:rgba(7,26,23,.7)}
.k-maphead > .minw0{flex:1}
.k-maphead b{display:block;font-size:19px;font-weight:600}
.k-maphead span{display:block;font-size:14px;color:var(--k-gold-2);margin-top:2px}
.k-etac{display:flex;align-items:baseline;gap:4px;padding:10px 14px;border-radius:16px;background:var(--k-gold);color:var(--k-ink)}
.k-etac b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.k-etac small{font-size:13px;font-weight:600}
.k-etac svg{align-self:center}
.k-mapwrap{flex:1;position:relative;overflow:hidden}
.k-mapsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.k-mapsvg text{font-family:var(--ui)}
.k-route{animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.k-phone{position:absolute;top:16px;inset-inline-end:16px;z-index:3;display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:16px;background:rgba(7,26,23,.85);border:1px solid rgba(217,180,106,.4);color:var(--k-gold-2);font-size:14px;font-weight:500;backdrop-filter:blur(6px)}
.k-sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;background:rgba(6,20,18,.95);border-top:1px solid rgba(217,180,106,.25);border-radius:28px 28px 0 0;backdrop-filter:blur(10px);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.k-sheet.closed{transform:translateY(calc(100% - 64px))}
.k-handle{width:100%;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:14px;color:rgba(251,248,241,.7)}
.k-handle i{width:44px;height:5px;border-radius:3px;background:rgba(251,248,241,.25)}
.k-rows{padding:0 16px 18px;display:flex;flex-direction:column;gap:8px}
.k-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;border:1px solid rgba(251,248,241,.08);transition:background .2s}
.k-row.on{background:rgba(217,180,106,.12);border-color:rgba(217,180,106,.45)}
.k-row > div{flex:1}
.k-row-ic{width:42px;height:42px;border-radius:12px;background:rgba(251,248,241,.08);color:var(--k-gold-2);display:grid;place-items:center;flex-shrink:0}
.k-row b{display:block;font-size:16px;font-weight:600}
.k-row span{display:block;font-size:13px;opacity:.65;margin-top:2px}
.k-sel{padding:10px 16px;border-radius:12px;border:1.5px solid var(--k-gold);color:var(--k-gold-2);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.k-row.on .k-sel{background:var(--k-gold);color:var(--k-ink)}
.k-qr{position:absolute;inset:0;z-index:10;background:rgba(4,14,12,.88);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;animation:kfade .25s both}
.k-qr-card{background:#fff;color:var(--k-text);border-radius:26px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:320px;text-align:center}
.k-qr-card p{margin:0;font-size:16px;font-weight:500;line-height:1.45}
.k-close{height:56px;padding:0 34px;border-radius:16px;border:1px solid rgba(251,248,241,.3);font-size:17px}

/* AI */
.k-ai-live{position:absolute;top:56px;left:0;right:0;bottom:0;background:#000}
.k-ai-live iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.k-ai-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(90% 60% at 50% 35%,#14503F,#071A17);font-size:16px;opacity:1;transition:opacity .8s;pointer-events:none;z-index:1}
.k-ai-load.gone{opacity:0}
.k-ai-top{position:absolute;top:70px;inset-inline-start:16px;z-index:3;display:flex;align-items:center;gap:10px}
.k-ai-chip{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:rgba(7,26,23,.75);border:1px solid rgba(217,180,106,.35);font-size:14px;color:var(--k-gold-2);backdrop-filter:blur(6px)}
.k-ai-chip i{width:8px;height:8px;border-radius:50%;background:#5EE3A8;box-shadow:0 0 8px #5EE3A8}
.k-hints{position:absolute;top:136px;left:16px;right:16px;z-index:3;display:flex;flex-wrap:wrap;gap:8px;transition:opacity .8s,transform .8s}
.k-hints.gone{opacity:0;transform:translateY(-10px);pointer-events:none}
.k-hints small{width:100%;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--k-gold-2);opacity:.85}
.k-hints span{padding:8px 14px;border-radius:999px;background:rgba(7,26,23,.72);border:1px solid rgba(251,248,241,.18);font-size:14px;backdrop-filter:blur(6px)}
.k-ai-demo{align-items:center;text-align:center;gap:14px}
.k-ai-demo .k-head{align-self:stretch}
.k-ai-demo .k-head h1{font-family:'Reem Kufi',var(--ui);color:var(--k-gold-2);font-weight:600}
.k-orbw{position:relative;width:220px;height:220px;flex-shrink:0;display:grid;place-items:center}
.k-orb{position:relative;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFF3D6 0%,#E8C987 20%,#C9A04E 42%,#1E7A66 76%,#0B2E28 100%);
  box-shadow:0 0 60px rgba(217,180,106,.45),inset 0 -14px 30px rgba(7,26,23,.45);animation:breathe 4.5s ease-in-out infinite}
.k-orb::after{content:"";position:absolute;inset:-22px;border-radius:50%;border:1px solid rgba(217,180,106,.35);border-top-color:var(--k-gold-2);animation:spin 5s linear infinite}
.k-orb.listen{animation:breathe 1.2s ease-in-out infinite}
.k-orb.listen::after{border-color:rgba(92,200,255,.5);border-top-color:var(--k-sky);animation-duration:1.4s}
.k-orb.think::after{animation-duration:.9s}
.k-orb.talk{animation:talk .45s ease-in-out infinite alternate}
@keyframes talk{to{transform:scale(1.07);box-shadow:0 0 90px rgba(217,180,106,.7),inset 0 -14px 30px rgba(7,26,23,.45)}}
.k-orb svg{position:absolute;inset:50px;color:rgba(7,26,23,.35)}
.k-ai-hello b{display:block;font-size:22px;font-weight:600}
.k-ai-hello span{display:block;font-size:15px;opacity:.65;margin-top:4px}
.k-chat{flex:1;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;min-height:0;overflow:hidden}
.k-msg{max-width:86%;padding:13px 17px;border-radius:20px;font-size:16px;line-height:1.5;text-align:start;animation:kfade .35s both}
.k-msg.me{align-self:flex-end;background:rgba(251,248,241,.12);border-end-end-radius:6px}
.k-msg.bot{align-self:flex-start;background:var(--k-ihram);color:var(--k-text);border-end-start-radius:6px;min-height:48px}
.k-msg.bot .k-dots{color:var(--k-jade);justify-content:flex-start;padding:6px 0}
.k-chips{align-self:stretch;display:flex;flex-direction:column;gap:8px}
.k-chips small{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--k-gold-2);opacity:.85}
.k-chips div{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.k-chips button{padding:9px 15px;border-radius:999px;border:1px solid rgba(251,248,241,.2);font-size:14px;color:rgba(251,248,241,.9)}
.k-micw{display:flex;flex-direction:column;align-items:center;gap:8px}
.k-mic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:var(--k-ink);background:radial-gradient(circle at 35% 30%,#FFF1CF,var(--k-gold) 55%,#A57F38);box-shadow:0 0 0 8px rgba(217,180,106,.16),0 12px 30px -8px rgba(217,180,106,.6)}
.k-micw span{font-size:14px;opacity:.7}
.k-note{font-size:12px;opacity:.45}
.k-openlive{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid rgba(217,180,106,.5);color:var(--k-gold-2);font-size:14px;font-weight:500;text-decoration:none;background:rgba(217,180,106,.08)}

/* idle warning */
.k-idle{position:absolute;inset:0;z-index:100;background:rgba(4,14,12,.75);backdrop-filter:blur(4px);display:grid;place-items:center;animation:kfade .25s both}
.k-idle-card{width:80%;background:var(--k-ihram);color:var(--k-text);border-radius:28px;padding:30px 26px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}

/* live avatar layer: one iframe that moves between the home tile and the AI screen */
.k-layer{position:absolute;z-index:4;overflow:hidden;background:#071A17;
  transition:left .5s cubic-bezier(.2,.8,.2,1),top .5s cubic-bezier(.2,.8,.2,1),width .5s cubic-bezier(.2,.8,.2,1),height .5s cubic-bezier(.2,.8,.2,1),border-radius .5s,opacity .3s}

/* AI tile on home */

.sg-hub-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

.sg-sign .pic{width:112px;height:112px;background:#000;color:var(--y);display:grid;place-items:center;border-radius:6px;flex-shrink:0}
.sg-sign > div.minw0{flex:1}

.sg-sign .minw0 span{display:block;font-size:15px;margin-top:4px;opacity:.78;line-height:1.4}

.sg-sos{height:96px;display:flex;align-items:center;gap:18px;padding:0 20px;background:#FF3B30;color:#fff;border-radius:8px;text-align:start;flex-shrink:0;transition:transform .15s}
.sg-sos > b{font-size:28px;font-weight:700;letter-spacing:.06em;padding:6px 12px;border:3px solid #fff;border-radius:6px}
.sg-sos strong{display:block;font-size:21px}
.sg-sos .minw0 span{display:block;font-size:14px;opacity:.92}
.sg-sos > div{flex:1}
/* Signal · landscape */
.land .sg-attract{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:56px 1fr auto auto;column-gap:0}
.land .sg-attract > .k-sb{grid-column:1/3}
.land .sg-top{grid-area:2/1/4/2;padding:30px 30px 0 60px;justify-content:center}
.land .sg-scan{grid-area:2/2;align-self:center;margin:30px 60px 0 30px}
.land .sg-arrow{grid-area:3/2}
.land .sg-attract > .k-langs{grid-area:4/1/5/3}
.land .sg-hub .k-pad{display:grid;grid-template-columns:500px minmax(0,1fr);grid-template-rows:auto auto 1fr;gap:16px 28px;padding:26px 48px 30px}
.land .sg-hub-top{grid-area:1/1}
.land .sg-strip{grid-area:2/1}
.land .sg-sos{grid-area:3/1;align-self:end}
.land .sg-signs{grid-area:1/2/4/3}

.dk-hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:30%;pointer-events:none}
/* Dusk · welcome */
.dk-att{flex:1;display:flex;flex-direction:column;align-items:center;gap:22px;padding:40px 34px 0;text-align:center;position:relative}
.dk-moon{position:relative;width:180px;height:180px;display:grid;place-items:center;flex-shrink:0}
.dk-moon::before{content:"";position:absolute;inset:-50px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,160,.38),transparent 64%);animation:breathe 5s ease-in-out infinite}
.dk-moon::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(255,255,255,.22);border-top-color:var(--sand);animation:spin 10s linear infinite}
.dk-moon-core{position:relative;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;color:rgba(140,70,50,.32);
  background:radial-gradient(circle at 38% 32%,#FFF6E6,#FFD8A8 45%,#F4A259 82%);box-shadow:0 0 90px rgba(255,200,140,.6),inset -18px -18px 40px rgba(232,106,122,.35)}
.dk-rot{min-height:150px;display:flex;flex-direction:column;align-items:center}
.dk-rot h1{margin:0;font-size:34px;font-weight:300;line-height:1.25;text-wrap:balance}
.dk-rot p{margin:12px 0 0;font-size:17px;opacity:.78;line-height:1.55;max-width:420px}
.dk-scan{width:100%;display:flex;align-items:center;gap:18px;padding:16px 18px;border-radius:30px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(18px);text-align:start;color:var(--cream);transition:transform .15s}
.dk-scan:active,.dk-reply:active,.dk-ava:active{transform:scale(.98)}
.dk-scan-ic{width:96px;height:96px;border-radius:24px;background:rgba(18,13,46,.55);display:grid;place-items:center;flex-shrink:0;position:relative;overflow:hidden;color:var(--sand)}
.dk-scan-ic .k-laser{background:linear-gradient(90deg,transparent,var(--sand),transparent);box-shadow:0 0 12px var(--sand)}
.dk-scan-ic .k-ok .ring{width:62px;height:62px;background:var(--saf)}
.dk-scan-t{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}

.dk-scan-t small{font-size:14px;opacity:.75;line-height:1.4}
.dk-scan .k-demo{align-self:flex-start;background:rgba(255,216,168,.16);color:var(--sand)}
.dk-below{color:var(--cream)}
/* Dusk · home */
.dk-hub-head{display:flex;justify-content:space-between;align-items:center;gap:10px}

.land .dk-att{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto auto;column-gap:70px;row-gap:18px;padding:30px 90px 0;align-items:center}

.land .dk-concierge{grid-area:2/1/4/2;align-self:center}

.top-r{display:flex;align-items:center;gap:12px}

.card h3{font-size:18px;font-weight:600;margin:12px 0 6px}
.card p{color:var(--muted);line-height:1.6;margin:0;font-size:15px}
.tour{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.tour li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:20px 28px;align-items:start;padding:24px 0;border-bottom:1px solid var(--line)}
.tn{font-family:var(--display);font-size:30px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.tour h3{margin:0 0 8px;font-size:21px;font-weight:600}
.tour p{margin:0;color:var(--muted);line-height:1.65;max-width:68ch}
.tour .ben{margin-top:12px;color:var(--fg);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.tour .ben b{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);font-weight:600}
.tshow{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid rgba(217,180,106,.45);color:var(--gold);font-size:14px;white-space:nowrap}
.tshow:hover{background:rgba(217,180,106,.08)}
[dir="rtl"] .flip{transform:scaleX(-1)}
.showcase[dir="rtl"] .eyebrow,.showcase[dir="rtl"] .steps-h,.showcase[dir="rtl"] .langs-h,.showcase[dir="rtl"] .proto,.showcase[dir="rtl"] .mark small,.showcase[dir="rtl"] .tour .ben b{letter-spacing:0;text-transform:none}
.showcase[dir="rtl"] .eyebrow,.showcase[dir="rtl"] .steps-h,.showcase[dir="rtl"] .langs-h{font-size:14px}
.showcase[dir="rtl"] .lead,.showcase[dir="rtl"] .band-lead,.showcase[dir="rtl"] .card p,.showcase[dir="rtl"] .tour p{line-height:1.85}
.showcase[dir="rtl"] h1.title{line-height:1.25}
@media (max-width:980px){.stats,.why,.ops{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){
  .stats,.why,.ops{grid-template-columns:minmax(0,1fr)}
  .tour li{grid-template-columns:44px minmax(0,1fr)}
  .tshow{grid-column:2;justify-self:start}
  .top-r .proto{display:none}
}

/* design picker on the presentation page */
.designs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.designs button{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;border:1px solid var(--line);text-align:start;color:var(--muted);transition:border-color .2s,color .2s}
.designs button:hover{color:var(--fg)}
.designs button.on{border-color:var(--gold);color:var(--fg);background:rgba(217,180,106,.06)}
.designs .sw{display:flex;gap:4px}
.designs .sw i{width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.15)}
.designs b{font-size:16px;font-weight:600;color:var(--fg)}
.designs span{font-size:13px;line-height:1.45}
@media (max-width:600px){.designs{grid-template-columns:minmax(0,1fr)}}
.pv-seg{display:flex;border-radius:12px;overflow:hidden;border:1px solid rgba(237,233,242,.18);background:rgba(12,11,16,.8);backdrop-filter:blur(8px)}
.pv-bar .pv-seg button{border:0;border-radius:0;background:none;padding:10px 14px;color:var(--muted)}
.pv-bar .pv-seg button.on{background:var(--gold);color:#1A1408}

function fakeQR(size = 25, px = 220) {
  const c = px / size; let seed = 7, out = '';
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y) => { for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) { const on = i === 0 || i === 6 || j === 0 || j === 6 || (i > 1 && i < 5 && j > 1 && j < 5); if (on) out += `<rect x="${(x+i)*c}" y="${(y+j)*c}" width="${c}" height="${c}"/>`; } };
  const inF = (i, j) => (i < 8 && j < 8) || (i > size - 9 && j < 8) || (i < 8 && j > size - 9);
  for (let i = 0; i < size; i++) for (let j = 0; j < size; j++) if (!inF(i, j) && rnd() > 0.52) out += `<rect x="${i*c}" y="${j*c}" width="${c}" height="${c}"/>`;
  finder(0, 0); finder(size - 7, 0); finder(0, size - 7);
  const m = px / 2;
  return `<svg width="${px}" height="${px}" viewBox="0 0 ${px} ${px}" fill="#071A17" aria-hidden="true">${out}<rect x="${m-22}" y="${m-22}" width="44" height="44" rx="10" fill="#fff"/><polygon points="${starPts(m,m,17)}" fill="#D9B46A"/></svg>`;
}

function nextPrayer() {
  const t = tt(), d = new Date(), now = d.getHours() * 60 + d.getMinutes();

  else diff = PRAYER_TIMES[i][0] * 60 + PRAYER_TIMES[i][1] - now;
  return { name: t.prayers[i], time: pad(PRAYER_TIMES[i][0]) + ':' + pad(PRAYER_TIMES[i][1]), in: fmt(t.inTime, { h: Math.floor(diff / 60), m: diff % 60 }) };

function mapSVG(it) {

    ${blocks}
    <path d="M270 0V826" stroke="${C.road}" stroke-width="24"/>
    <path d="M${x0} 420H${x0 + VW}" stroke="${C.road2}" stroke-width="18"/>
    <path d="M${x0} 790L20 720C160 650 300 590 530 400L${x0 + VW} 120" fill="none" stroke="${C.metro}" stroke-width="4" stroke-dasharray="12 8" opacity=".85"/>
    <circle cx="352" cy="548" r="8" fill="${C.bg}" stroke="${C.metro}" stroke-width="3"/>${lbl(352, 580, t.metro, C.metroL, 12)}

    <path d="${route}" fill="none" stroke="${C.glow}" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="k-route" d="${route}" fill="none" stroke="${C.route}" stroke-width="${S.theme === 'signal' ? 7 : 5}" stroke-dasharray="3 11" stroke-linejoin="round" stroke-linecap="round"/>

/* ═════════ LIVE AVATAR LAYER ═════════
   One iframe that outlives screen changes. On the home screen it sits inside the AI tile as a live
   preview; opening the AI screen grows the same iframe to full size, so nothing reloads. A tap that
   lands inside the tile's iframe also opens the AI screen, so tapping "Chat now" there starts at once. */
// The embed is asked for the layout that matches the kiosk screen: vertical when upright, horizontal when wide.
const avUrl = () => CONFIG.avatarUrl.split('?')[0] + '?orientation=' + (isLand() ? 'horizontal' : 'vertical');
const layer = document.createElement('div'); layer.className = 'k-layer off'; $app.appendChild(layer);

let frame = null, frameReady = false;
function ensureFrame() {
  if (aiFallback || frame) return;
  frameReady = false;
  layer.innerHTML = `<div class="k-ai-load"><div class="k-mini-orb big"></div><span></span></div>`;
  frame = document.createElement('iframe');
  layer.style.setProperty('--ar', isLand() ? '1.7778' : '0.5625'); frame.src = avUrl(); frame.allow = 'microphone; camera; autoplay; fullscreen'; frame.title = 'Daleel';
  frame.addEventListener('load', () => { frameReady = true; layer.classList.add('ready'); layer.querySelector('.k-ai-load')?.classList.add('gone'); });
  layer.appendChild(frame);
}
function resetFrame() { if (frame) { frame.remove(); frame = null; } frameReady = false; layer.innerHTML = ''; layer.className = 'k-layer off'; }
function relRect(el) { let x = 0, y = 0, e = el; while (e && e !== $app) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return { x, y, w: el.offsetWidth, h: el.offsetHeight }; }
function placeLayer(instant) {
  let mode = 'off', r = null;
  if (!aiFallback && S.screen === 'hub') { const m = $view.querySelector('.k-ava-media'); if (m) { ensureFrame(); r = relRect(m); mode = 'tile'; } }
  else if (!aiFallback && S.screen === 'ai') { ensureFrame(); const land = isLand(), rtl = tt().dir === 'rtl'; r = land ? { x: 0, y: 56, w: 1280, h: 664 } : { x: 0, y: 56, w: 540, h: 904 }; mode = 'full'; }
  layer.className = 'k-layer ' + mode + (frameReady ? ' ready' : '') + (instant ? ' instant' : '');
  if (r) Object.assign(layer.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
  if (instant) requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.remove('instant')));
  const sp = layer.querySelector('.k-ai-load span'); if (sp) sp.textContent = tt().loading;
}
window.addEventListener('blur', () => setTimeout(() => {
  if (!frame || document.activeElement !== frame) return;
  if (S.screen === 'hub') go('ai'); else resetIdle();
}, 0));
document.addEventListener('securitypolicyviolation', e => {
  if (aiFallback || !/embed\.liveavatar/i.test(e.blockedURI || '')) return;
  aiFallback = true; resetFrame();
  if (S.screen === 'ai' || S.screen === 'hub') { clearTimers(); aiClear(); render(); }
});

/* ═════════ AI DEMO CONVERSATION (used only when the embed is blocked) ═════════ */
let aiT = [];
const aiClear = () => { aiT.forEach(id => { clearTimeout(id); clearInterval(id); }); aiT = []; };
const aiLater = (fn, ms) => aiT.push(setTimeout(fn, ms));
function orb(state) { const o = document.getElementById('kOrb'); if (o) o.className = 'k-orb ' + state; }
function playQA(i) {
  aiClear();
  const chat = document.getElementById('kChat'); if (!chat) return;
  const t = tt(), q = [t.q1,t.q2,t.q3][i], a = [t.a1,t.a2,t.a3][i];
  chat.innerHTML = `<div class="k-msg me">${q}</div>`; orb('listen');
  aiLater(() => { chat.insertAdjacentHTML('beforeend', `<div class="k-msg bot"><span class="k-dots"><i></i><i></i><i></i></span></div>`); orb('think'); }, 1100);
  aiLater(() => {
    const el = chat.querySelector('.bot'); if (!el) return;
    const sep = /\s/.test(a) ? ' ' : '', parts = a.split(sep); let n = 0; orb('talk');
    const iv = setInterval(() => { n++; el.textContent = parts.slice(0, n).join(sep);
      if (n >= parts.length) { clearInterval(iv); orb(''); aiLater(() => playQA((i + 1) % 3), 4800); } }, sep ? 120 : 60);
    aiT.push(iv);
  }, 2400);
}

/* ═════════ ROUTER ═════════ */
const VIEWS = { attract:vAttract, verify:vVerify, hub:vHub, emergency:vEmergency, wayfinding:vWayfinding, map:vMap, ai:vAI };
const BACK = { verify:'attract', hub:'attract', emergency:'hub', wayfinding:'hub', map:'wayfinding', ai:'hub' };
let enterT;
function render(prev) {
  $app.dataset.lang = shownLang(); $app.dataset.theme = S.theme;
  $view.innerHTML = VIEWS[S.screen]();
  placeLayer(!(prev === 'hub' && S.screen === 'ai'));
  after(); syncShowcase();
}
function go(screen) {
  const prev = S.screen;
  clearTimers(); aiClear();
  Object.assign(S, { screen, call:null, sos:false, qr:false, langSheet:false });
  if (screen === 'attract') Object.assign(S, { scan:'idle', locked:false, rot:0, lang:'ar' });
  if (screen === 'map') Object.assign(S, { sel:0, sheet:true });
  if ((prev === 'ai' && screen !== 'ai') || screen === 'attract') resetFrame(); // leaving the AI ends the avatar session
  $app.classList.add('entering'); clearTimeout(enterT); enterT = setTimeout(() => $app.classList.remove('entering'), 700);
  render(prev); resetIdle();
}
function after() {
  if (S.screen === 'attract' && S.scan === 'idle' && !S.locked && !S.langSheet) every(rotate, 3400);
  if (S.screen === 'hub') every(() => { const np = nextPrayer(); ['name','time','in'].forEach(k => { const e = $view.querySelector(`[data-pr="${k}"]`); if (e) e.textContent = np[k]; }); }, 20000);
  if (S.screen === 'emergency' && !S.sos) bindSOS();
  if (S.screen === 'ai') {
    if (!aiFallback) later(() => document.getElementById('kHints')?.classList.add('gone'), 10000);
    else later(() => playQA(0), 900);
  }
}
function rotate() {
  S.rot = (S.rot + 1) % LANGS.length;
  const L = LANGS[S.rot], r = T[L.code];
  $app.dataset.lang = L.code;
  ['kRot','kRot2','kRot3'].forEach(id => { const el = document.getElementById(id); if (!el) return;
    el.dir = r.dir; el.lang = L.code;
    el.querySelectorAll('[data-k]').forEach(n => n.textContent = r[n.dataset.k]);
    el.classList.remove('k-fade'); void el.offsetWidth; el.classList.add('k-fade'); });
  $view.querySelectorAll('.k-lp[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === L.code));
  $view.querySelector('.k-lp.more')?.classList.toggle('on', !!L.more);
  syncShowcase();
}

/* SOS press-and-hold */
function bindSOS() {
  const btn = document.getElementById('kSos'), ring = document.getElementById('kRing'), txt = document.getElementById('kSosTxt');
  const C = 879.6; let start = 0, raf = 0;
  const set = p => ring.style.strokeDashoffset = C * (1 - p);
  const tick = ts => { if (!start) start = ts; const p = Math.min(1, (ts - start) / CONFIG.sosHoldMs); set(p);
    if (p >= 1) { stop(false); fire(); } else raf = requestAnimationFrame(tick); };
  const begin = e => { e.preventDefault(); btn.setPointerCapture?.(e.pointerId); start = 0; btn.classList.add('hold'); txt.textContent = tt().sosHolding; raf = requestAnimationFrame(tick); };
  const stop = (reset = true) => { cancelAnimationFrame(raf); btn.classList.remove('hold'); txt.textContent = tt().sosHold; if (reset) { ring.style.transition = 'stroke-dashoffset .35s'; set(0); setTimeout(() => ring.style.transition = '', 360); } };
  const fire = () => {
    // TODO: send the alert to your dispatch backend here (kiosk ID, location, pilgrim ID, language)
    console.log('[SOS]', { kiosk:'K-12', lang:S.lang, at:new Date().toISOString() });
    S.sos = true; render();
  };
  btn.addEventListener('pointerdown', begin);
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev => btn.addEventListener(ev, () => stop()));
}

/* Taps */
$app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || !$app.contains(el)) return;
  const a = el.dataset.act, v = el.dataset.v;
  switch (a) {
    case 'go': go(v); break;
    case 'back': go(BACK[S.screen] || 'attract'); break;
    case 'scan':
      if (S.scan !== 'idle') return;
      clearTimers(); S.lang = shownLang();
      S.scan = 'ok'; render(); later(() => go('verify'), 1100); break;
    case 'langs': clearTimers(); S.langSheet = true; render(); break;
    case 'closeLangs': S.langSheet = false; render(); break;
    case 'pickLang':
      if (S.screen === 'attract') { clearTimers(); S.locked = true; }
      S.lang = v; S.langSheet = false; render(); break;
    case 'map': S.mode = v; go('map'); break;
    case 'sel': S.sel = +v; render(); break;
    case 'sheet': if (isLand()) break; S.sheet = !S.sheet; $view.querySelector('.k-sheet')?.classList.toggle('closed', !S.sheet); break;
    case 'qr': S.qr = true; render(); break;
    case 'qrClose': S.qr = false; render(); break;
    case 'call':
      // TODO: connect to your telephony / intercom integration here
      S.call = v; render(); break;
    case 'endCall': S.call = null; render(); break;
    case 'cancelSos': S.sos = false; render(); break;
    case 'ask': playQA(+v); break;
    case 'mic': { aiClear(); orb('listen'); const m = document.getElementById('kMicTxt'); if (m) m.textContent = tt().listening;
      const next = Math.floor(Math.random() * 3); aiLater(() => { if (m) m.textContent = tt().tapMic; playQA(next); }, 1500); break; }
  }
});

function resetIdle() {
  clearTimeout(idleT); clearInterval(warnT); warnEl?.remove(); warnEl = null;
  if (S.screen === 'attract') return;
  idleT = setTimeout(warn, S.screen === 'ai' ? CONFIG.idleAI : (KIOSK ? CONFIG.idleKiosk : CONFIG.idleShowcase));
}
function warn() {
  let n = CONFIG.warnSec; const t = tt();
  warnEl = document.createElement('div'); warnEl.className = 'k-idle'; warnEl.dir = t.dir;

  warnEl.querySelector('button').onclick = ev => { ev.stopPropagation(); resetIdle(); };
  $app.appendChild(warnEl);

const G = () => PAGE[GL];
const showcaseEl = document.querySelector('.showcase');
function applyGuide(lang, syncKiosk) {
  GL = lang; const g = G();
  showcaseEl.dir = g.dir; showcaseEl.lang = lang;
  document.title = lang === 'ar' ? 'كشك دليل للحج' : 'Daleel Hajj Kiosk';
  showcaseEl.querySelectorAll('[data-g]').forEach(el => el.textContent = g[el.dataset.g]);
  showcaseEl.querySelectorAll('[data-gh]').forEach(el => el.innerHTML = g[el.dataset.gh]);
  document.querySelectorAll('[data-glang]').forEach(b => b.classList.toggle('on', b.dataset.glang === lang));
  stepsEl.innerHTML = g.steps.map(([k, l, s], i) => `<li><button data-step="${k}"><span class="n">${i + 1}</span><span class="minw0"><span class="lbl">${l}</span></span><span class="sub">${s}</span></button></li>`).join('');
  designsEl.innerHTML = DESIGNS.map(d => `<button data-design="${d.id}"><span class="sw">${d.sw.map(c => `<i style="background:${c}"></i>`).join('')}</span><b>${g.designs[d.id][0]}</b><span>${g.designs[d.id][1]}</span></button>`).join('');
  pvDesign.innerHTML = DESIGNS.map(d => `<button data-design="${d.id}">${g.designs[d.id][0]}</button>`).join('');
  document.querySelector('#pvExit span').textContent = g.exit;
  document.getElementById('stats').innerHTML = g.stats.map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join('');
  document.getElementById('why').innerHTML = g.why.map(([i, h, p]) => `<div class="card">${ic(i, 26, 1.6)}<h3>${h}</h3><p>${p}</p></div>`).join('');
  document.getElementById('tour').innerHTML = g.tour.map(([k, h, p, b], i) => `<li><span class="tn">${String(i + 1).padStart(2, '0')}</span><div class="minw0"><h3>${h}</h3><p>${p}</p><p class="ben"><b>${g.why1}</b>${b}</p></div><button class="tshow" data-step="${k}">${g.show}${ic('chev', 16, 2.2, 'flip')}</button></li>`).join('');
  document.getElementById('ops').innerHTML = g.ops.map(([i, h, p]) => `<div class="card">${ic(i, 26, 1.6)}<h3>${h}</h3><p>${p}</p></div>`).join('');

document.querySelectorAll('[data-glang]').forEach(b => b.addEventListener('click', () => applyGuide(b.dataset.glang, true)));
document.getElementById('tour').addEventListener('click', e => {
  const b = e.target.closest('[data-step]'); if (!b) return;

});

/* ═════════ SCALING ═════════ */
const fitEl = document.getElementById('fit'), totem = document.getElementById('totem'), kcol = document.getElementById('kcol');
function fit() {
  if (presenting) {
    const want = wantLand();
    if (want !== isLand()) { $app.classList.toggle('land', want); resetFrame(); render(); }
    const W = isLand() ? 1280 : 540, H = isLand() ? 720 : 960, s = Math.min(innerWidth / W, innerHeight / H);
    $app.style.transform = `translate(-50%,-50%) scale(${s})`; updateOrientBtn(); return;
  }
  const W = 660, H = 1360, wide = innerWidth > 980;
  const s = wide ? Math.min((innerHeight - 130) / H, (innerWidth * 0.46) / W, 0.86) : Math.min(kcol.clientWidth / (W + 40), 0.62);
  const sc = Math.max(0.3, s);
  fitEl.style.width = W * sc + 'px'; fitEl.style.height = H * sc + 'px'; totem.style.transform = `scale(${sc})`;
}
if (KIOSK) {
  document.body.classList.add('kiosk');
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen?.() : document.documentElement.requestFullscreen?.().catch(() => {}); } });
  enterPresent();
}
addEventListener('resize', () => { fit(); placeLayer(true); });
addEventListener('hashchange', () => location.reload());
document.fonts?.ready.then(() => placeLayer(true));
